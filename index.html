<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Study Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --surface2: #f0ede6;
    --border: #e2ddd6; --border2: #ccc8c0;
    --text: #1a1916; --text2: #6b6860; --text3: #a09d98;
    --green: #1d9e75; --green-light: #e1f5ee; --green-dark: #0f6e56;
    --radius: 10px; --radius-lg: 14px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1.5rem; }
  .container { max-width: 780px; margin: 0 auto; }
  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { font-size: 14px; color: var(--text2); margin-top: 4px; }

  .metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 1.75rem; }
  .metric { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .metric-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .metric-value { font-size: 26px; font-weight: 600; line-height: 1; }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; }

  .add-btn { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 6px 14px; font-size: 13px; font-family: 'DM Sans',sans-serif; cursor: pointer; color: var(--text2); display: flex; align-items: center; gap: 6px; transition: background .15s; }
  .add-btn:hover { background: var(--surface2); }

  .modules { display: flex; flex-direction: column; gap: 10px; margin-bottom: 2rem; }
  .module-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 18px; transition: box-shadow .15s; user-select: none; }
  .module-card.drag-over { box-shadow: 0 0 0 2px var(--green); }
  .module-card.ghost { opacity: .3; }
  .module-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .module-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .drag-handle { cursor: grab; color: var(--text3); font-size: 15px; padding: 2px 4px; flex-shrink: 0; display: flex; align-items: center; }
  .drag-handle:active { cursor: grabbing; }
  .color-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .module-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .module-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .module-pct { font-size: 13px; color: var(--text2); font-family: 'DM Mono',monospace; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; padding: 3px 6px; border-radius: 6px; transition: all .15s; line-height: 1; }
  .icon-btn:hover { color: var(--text); background: var(--surface2); }
  .icon-btn.danger:hover { color: #e24b4a; background: #fff0f0; }
  .bar-bg { background: var(--surface2); border-radius: 4px; height: 5px; width: 100%; margin-bottom: 12px; }
  .bar-fill { height: 5px; border-radius: 4px; transition: width .5s ease; }
  .lessons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 12px; padding: 4px 11px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface2); color: var(--text2); cursor: pointer; transition: all .15s; user-select: none; }
  .chip:hover { border-color: var(--border2); }
  .chip.done { background: var(--green-light); color: var(--green-dark); border-color: #5dcaa5; }
  .add-topic-btn { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 0.5px dashed var(--border2); background: transparent; color: var(--text3); cursor: pointer; font-family: 'DM Sans',sans-serif; transition: all .15s; display: inline-flex; align-items: center; gap: 4px; }
  .add-topic-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-light); }
  .inline-row { display: flex; align-items: center; gap: 6px; width: 100%; }
  .inline-input { flex: 1; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--green); font-size: 12px; font-family: 'DM Sans',sans-serif; background: var(--surface); color: var(--text); outline: none; min-width: 0; }
  .inline-ok { background: var(--green); border: none; border-radius: 20px; padding: 5px 14px; font-size: 12px; font-family: 'DM Sans',sans-serif; color: #fff; cursor: pointer; font-weight: 500; white-space: nowrap; }
  .inline-x { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; padding: 2px 4px; }

  /* ── streak section ── */
  .streak-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 2rem; }
  .streak-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .streak-stats { display: flex; gap: 24px; }
  .streak-stat { text-align: center; }
  .streak-stat-val { font-size: 22px; font-weight: 600; line-height: 1; color: var(--text); }
  .streak-stat-label { font-size: 11px; color: var(--text3); margin-top: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .mark-btn { background: var(--green); border: none; border-radius: var(--radius); padding: 9px 20px; font-size: 13px; font-family: 'DM Sans',sans-serif; color: #fff; cursor: pointer; font-weight: 500; transition: opacity .15s; }
  .mark-btn:hover { opacity: .88; }
  .mark-btn.already { background: var(--green-light); color: var(--green-dark); border: 0.5px solid #5dcaa5; cursor: default; }
  .mark-btn.already:hover { opacity: 1; }

  .cal-month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-month-label { font-size: 13px; font-weight: 500; color: var(--text2); }
  .nav-btn { background: none; border: 0.5px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text2); font-size: 13px; padding: 3px 10px; transition: background .15s; }
  .nav-btn:hover { background: var(--surface2); }

  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-header { font-size: 10px; font-weight: 600; color: var(--text3); text-align: center; text-transform: uppercase; padding-bottom: 4px; }
  .cal-day { aspect-ratio: 1; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text2); border: 0.5px solid transparent; }
  .cal-day.studied { background: var(--green); color: #fff; border-color: var(--green); }
  .cal-day.today { border: 1.5px solid var(--green); color: var(--text); font-weight: 600; }
  .cal-day.today.studied { background: var(--green); color: #fff; }
  .cal-day.other-month { color: var(--text3); opacity: .4; }
  .cal-day.empty { border: none; }

  /* modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 100; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 1.5rem; width: 340px; box-shadow: 0 8px 40px rgba(0,0,0,.12); }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 1rem; }
  .modal input { width: 100%; margin-bottom: 10px; padding: 9px 12px; border-radius: var(--radius); border: 0.5px solid var(--border2); font-size: 13px; font-family: 'DM Sans',sans-serif; background: var(--surface); color: var(--text); outline: none; transition: border-color .15s; }
  .modal input:focus { border-color: var(--green); }
  .modal input::placeholder { color: var(--text3); }
  .modal-hint { font-size: 11px; color: var(--text3); margin-top: -6px; margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .btn-cancel { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 7px 16px; font-size: 13px; font-family: 'DM Sans',sans-serif; cursor: pointer; color: var(--text2); }
  .btn-save { background: var(--green); border: none; border-radius: var(--radius); padding: 7px 16px; font-size: 13px; font-family: 'DM Sans',sans-serif; cursor: pointer; color: #fff; font-weight: 500; }
  .empty { color: var(--text3); font-size: 13px; padding: 1rem 0; }

  @media (max-width: 600px) { .metrics { grid-template-columns: repeat(2,1fr); } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>AI Study Progress</h1>
    <p>Track your course modules, lessons, and daily streak</p>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="section-header">
    <div class="section-title">Modules</div>
    <button class="add-btn" onclick="openModal()">+ Add module</button>
  </div>
  <div class="modules" id="modules-list"></div>

  <div class="section-header">
    <div class="section-title">Study streak</div>
  </div>
  <div class="streak-card">
    <div class="streak-top">
      <div class="streak-stats">
        <div class="streak-stat"><div class="streak-stat-val" id="cur-streak">0</div><div class="streak-stat-label">Current streak</div></div>
        <div class="streak-stat"><div class="streak-stat-val" id="longest-streak">0</div><div class="streak-stat-label">Longest streak</div></div>
        <div class="streak-stat"><div class="streak-stat-val" id="total-days">0</div><div class="streak-stat-label">Days studied</div></div>
      </div>
      <button class="mark-btn" id="mark-btn" onclick="markToday()">Mark today as studied</button>
    </div>
    <div class="cal-month-nav">
      <button class="nav-btn" onclick="prevMonth()">&#8592;</button>
      <div class="cal-month-label" id="cal-label"></div>
      <button class="nav-btn" onclick="nextMonth()">&#8594;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Add module</h3>
    <input id="mod-name" placeholder="Module name (e.g. Neural Networks)" />
    <input id="mod-lessons" placeholder="Lessons (comma-separated)" />
    <div class="modal-hint">e.g. Perceptron, Backprop, Activation Functions</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveModule()">Save</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#3266ad','#1d9e75','#d4537e','#ba7517','#44a8ba','#d85a30'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY_HEADERS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ── helpers ── */
function toKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function todayKey() { return toKey(new Date()); }

/* ── state ── */
let state = {
  modules: [
    { id:1, name:'Foundations of ML',     color:COLORS[0], lessons:['Linear Regression','Logistic Regression','Bias-Variance','Cross-validation'], done:[0,1] },
    { id:2, name:'Neural Networks',        color:COLORS[1], lessons:['Perceptron','Backpropagation','Activation Functions','Optimizers'],           done:[0]   },
    { id:3, name:'Deep Learning',          color:COLORS[2], lessons:['CNNs','RNNs','Transformers','Attention'],                                     done:[]    },
    { id:4, name:'Reinforcement Learning', color:COLORS[3], lessons:['MDPs','Q-Learning','Policy Gradient'],                                        done:[]    },
  ],
  studiedDays: [],   // array of 'YYYY-MM-DD' strings
  nextId: 5
};

try { const s = localStorage.getItem('ai_prog4'); if(s) state = JSON.parse(s); } catch(e){}
function save() { try { localStorage.setItem('ai_prog4', JSON.stringify(state)); } catch(e){} }

/* ── calendar view state ── */
const now = new Date();
let viewYear  = now.getFullYear();
let viewMonth = now.getMonth();

/* ── render ── */
function render() { renderMetrics(); renderModules(); renderStreak(); }

function renderMetrics() {
  const total  = state.modules.reduce((a,m)=>a+m.lessons.length,0);
  const done   = state.modules.reduce((a,m)=>a+m.done.length,0);
  const pct    = total ? Math.round(done/total*100) : 0;
  const cur    = calcCurrentStreak();
  const active = state.modules.filter(m=>m.done.length>0&&m.done.length<m.lessons.length).length;
  const compl  = state.modules.filter(m=>m.lessons.length&&m.done.length===m.lessons.length).length;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-label">Overall</div><div class="metric-value">${pct}%</div><div class="metric-sub">${done} of ${total} lessons</div></div>
    <div class="metric"><div class="metric-label">Streak</div><div class="metric-value">${cur}d</div><div class="metric-sub">days in a row</div></div>
    <div class="metric"><div class="metric-label">In progress</div><div class="metric-value">${active}</div><div class="metric-sub">modules active</div></div>
    <div class="metric"><div class="metric-label">Completed</div><div class="metric-value">${compl}</div><div class="metric-sub">of ${state.modules.length} modules</div></div>`;
}

/* ── streak calculations ── */
function calcCurrentStreak() {
  const set = new Set(state.studiedDays);
  let streak = 0;
  const d = new Date();
  // if today not studied, start counting from yesterday
  if (!set.has(toKey(d))) d.setDate(d.getDate()-1);
  while (set.has(toKey(d))) {
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function calcLongestStreak() {
  if (!state.studiedDays.length) return 0;
  const sorted = [...state.studiedDays].sort();
  let longest = 1, cur = 1;
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i-1]);
    const curr = new Date(sorted[i]);
    const diff = (curr - prev) / 86400000;
    if (diff === 1) { cur++; longest = Math.max(longest, cur); }
    else cur = 1;
  }
  return longest;
}

function renderStreak() {
  const studied = new Set(state.studiedDays);
  const tKey    = todayKey();
  const alreadyToday = studied.has(tKey);

  document.getElementById('cur-streak').textContent     = calcCurrentStreak();
  document.getElementById('longest-streak').textContent = calcLongestStreak();
  document.getElementById('total-days').textContent     = state.studiedDays.length;

  const btn = document.getElementById('mark-btn');
  if (alreadyToday) {
    btn.textContent = '✓ Studied today';
    btn.className   = 'mark-btn already';
  } else {
    btn.textContent = 'Mark today as studied';
    btn.className   = 'mark-btn';
  }

  renderCalendar(studied, tKey);
}

function renderCalendar(studied, tKey) {
  document.getElementById('cal-label').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

  const grid = document.getElementById('cal-grid');
  let html = DAY_HEADERS.map(d=>`<div class="cal-header">${d}</div>`).join('');

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const daysInPrev  = new Date(viewYear, viewMonth, 0).getDate();

  // leading blanks from previous month
  for (let i = 0; i < firstDay; i++) {
    const d = daysInPrev - firstDay + 1 + i;
    html += `<div class="cal-day other-month">${d}</div>`;
  }

  // current month days
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isStudied = studied.has(key);
    const isToday   = key === tKey;
    let cls = 'cal-day';
    if (isStudied) cls += ' studied';
    if (isToday)   cls += ' today';
    html += `<div class="${cls}">${d}</div>`;
  }

  // trailing blanks
  const total = firstDay + daysInMonth;
  const trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= trailing; d++) {
    html += `<div class="cal-day other-month">${d}</div>`;
  }

  grid.innerHTML = html;
}

function prevMonth() {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderStreak();
}
function nextMonth() {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderStreak();
}

function markToday() {
  const key = todayKey();
  if (state.studiedDays.includes(key)) return;
  state.studiedDays.push(key);
  // snap calendar to current month when marking
  viewYear  = now.getFullYear();
  viewMonth = now.getMonth();
  save(); render();
}

/* ── modules ── */
function renderModules() {
  const el = document.getElementById('modules-list');
  if (!state.modules.length) { el.innerHTML='<div class="empty">No modules yet. Add your first one above.</div>'; return; }

  el.innerHTML = state.modules.map((m, idx) => {
    const pct   = m.lessons.length ? Math.round(m.done.length/m.lessons.length*100) : 0;
    const chips = m.lessons.map((l,i) => {
      const isDone = m.done.includes(i);
      return `<span class="chip ${isDone?'done':''}" onclick="toggleLesson(${m.id},${i})">${isDone?'&#10003; ':''}${l}</span>`;
    }).join('');
    const footer = addingFor === m.id
      ? `<div class="inline-row">
           <input class="inline-input" id="ti-${m.id}" placeholder="Topic name" onkeydown="topicKey(event,${m.id})">
           <button class="inline-ok" onclick="confirmTopic(${m.id})">Add</button>
           <button class="inline-x" onclick="cancelTopic()">&#x2715;</button>
         </div>`
      : `<button class="add-topic-btn" onclick="startTopic(${m.id})">+ topic</button>`;

    return `<div class="module-card" data-idx="${idx}">
      <div class="module-top">
        <div class="module-left">
          <span class="drag-handle" data-idx="${idx}" title="Drag to reorder">&#8942;&#8942;</span>
          <span class="color-dot" style="background:${m.color}"></span>
          <span class="module-name">${m.name}</span>
        </div>
        <div class="module-right">
          <span class="module-pct">${pct}%</span>
          <button class="icon-btn danger" onclick="deleteModule(${m.id})" title="Remove">&#128465;</button>
        </div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${m.color}"></div></div>
      <div class="lessons">${chips}${footer}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('.drag-handle').forEach(h => h.addEventListener('mousedown', startDrag));
  if (addingFor !== null) {
    const inp = document.getElementById(`ti-${addingFor}`);
    if (inp) setTimeout(()=>inp.focus(), 0);
  }
}

let addingFor = null;
function toggleLesson(id, idx) {
  const m = state.modules.find(x=>x.id===id); if(!m) return;
  m.done = m.done.includes(idx) ? m.done.filter(x=>x!==idx) : [...m.done, idx];
  save(); render();
}
function deleteModule(id) { state.modules=state.modules.filter(x=>x.id!==id); save(); render(); }
function startTopic(id)   { addingFor=id; renderModules(); }
function cancelTopic()    { addingFor=null; renderModules(); }
function confirmTopic(id) {
  const inp = document.getElementById(`ti-${id}`);
  const val = inp ? inp.value.trim() : '';
  if (!val) { inp&&inp.focus(); return; }
  const m = state.modules.find(x=>x.id===id); if(!m) return;
  m.lessons.push(val);
  addingFor=null; save(); render();
}
function topicKey(e, id) {
  if(e.key==='Enter')  confirmTopic(id);
  if(e.key==='Escape') cancelTopic();
}

/* ── drag reorder ── */
let dragging=false, srcIdx=null, ghost=null, placeholder=null, startY=0;
function startDrag(e) {
  e.preventDefault();
  srcIdx   = parseInt(e.currentTarget.dataset.idx);
  dragging = true;
  startY   = e.clientY;
  const list  = document.getElementById('modules-list');
  const cards = Array.from(list.querySelectorAll('.module-card'));
  const card  = cards[srcIdx];
  const rect  = card.getBoundingClientRect();
  ghost = card.cloneNode(true);
  ghost.style.cssText=`position:fixed;top:${rect.top}px;left:${rect.left}px;width:${rect.width}px;opacity:.85;pointer-events:none;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.15);border-radius:14px;`;
  document.body.appendChild(ghost);
  placeholder = document.createElement('div');
  placeholder.style.cssText=`height:${rect.height}px;border-radius:14px;background:var(--green-light);border:1.5px dashed var(--green);`;
  card.replaceWith(placeholder);
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup',   endDrag);
}
function onDrag(e) {
  if(!dragging) return;
  ghost.style.transform=`translateY(${e.clientY-startY}px)`;
  const ghostMid = ghost.getBoundingClientRect().top + ghost.getBoundingClientRect().height/2;
  const list  = document.getElementById('modules-list');
  const current = Array.from(list.querySelectorAll('.module-card'));
  let newIdx = list.children.length;
  for(let i=0;i<current.length;i++){
    const r=current[i].getBoundingClientRect();
    if(ghostMid < r.top+r.height/2){ newIdx=i; break; }
  }
  const phIdx = Array.from(list.children).indexOf(placeholder);
  if(phIdx!==newIdx){
    if(newIdx>=list.children.length) list.appendChild(placeholder);
    else list.insertBefore(placeholder, list.children[newIdx]);
  }
}
function endDrag() {
  if(!dragging) return;
  dragging=false;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup',   endDrag);
  ghost.remove();
  const list    = document.getElementById('modules-list');
  const destIdx = Array.from(list.children).indexOf(placeholder);
  placeholder.remove();
  const [moved] = state.modules.splice(srcIdx,1);
  state.modules.splice(destIdx,0,moved);
  save(); render();
}

/* ── modal ── */
function openModal()  { document.getElementById('overlay').classList.add('open'); setTimeout(()=>document.getElementById('mod-name').focus(),50); }
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('mod-name').value='';
  document.getElementById('mod-lessons').value='';
}
function saveModule() {
  const name = document.getElementById('mod-name').value.trim();
  const lessons = document.getElementById('mod-lessons').value.split(',').map(x => x.trim()).filter(Boolean);
  
  if (!name) return;

  // Better color assignment - cycles properly
  const colorIndex = state.modules.length % COLORS.length;
  const newColor = COLORS[colorIndex];

  state.modules.push({
    id: state.nextId++,
    name: name,
    color: newColor,
    lessons: lessons,
    done: []
  });

  save(); 
  closeModal(); 
  render();
}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
</body>
</html>
